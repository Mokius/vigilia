<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>VIGILIA — El Turno de Noche · Ubicuity U-Box</title>
<meta name="description" content="Experiencia de terror inmersiva para el cubo de 4 pantallas de Ubicuity." />
<style>
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ width:100%; height:100%; overflow:hidden; background:#000; color:#e8e8ea;
    font-family:"Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; cursor:none; }
  #app{ position:fixed; inset:0; display:block; width:100vw; height:100vh; background:#000; }
  #ui{ position:fixed; inset:0; pointer-events:none; z-index:10; }
  .noselect{ user-select:none; -webkit-user-select:none; }
  #boot{ position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center;
    background:#000; color:#6b6b70; letter-spacing:.35em; font-size:13px; text-transform:uppercase; }
  #boot .b-in{ text-align:center; }
  #boot .bar{ width:220px; height:2px; background:#161618; margin:16px auto 0; overflow:hidden; }
  #boot .bar > i{ display:block; height:100%; width:0; background:#c9302c; transition:width .25s ease; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>
</head>
<body class="noselect">
  <canvas id="app"></canvas>
  <div id="ui"></div>
  <div id="boot"><div class="b-in">Inicializando<div class="bar"><i id="bootbar"></i></div></div></div>
  <script type="module" src="./app.min.js"></script>
</body>
